[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq-framework"
version = "0.1.0"
description = "Production-ready data quality framework for modern data stacks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meownikenia", email = "you@example.com" }]
dependencies = [
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "httpx>=0.25",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.6",
    "mypy>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
dq = "dq_framework.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_framework"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = [
    "B008",   # typer uses function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"src/dq_framework/integrations/airflow.py" = ["N806"]   # BaseOperator is a class-like import
"src/dq_framework/reporters/html.py" = ["E501"]         # HTML template lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dq_framework --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/dq_framework"]
omit = [
    "*/integrations/airflow.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]


addopts = "--cov=dq_framework --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
